<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crossword Builder</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="print.css" media="print" />
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="title">Crossword</div>

      <div class="controls">
        <input type="file" id="fileInput" accept="application/json" />
        <button id="checkBtn" hidden>Check puzzle</button>
        <div id="timer">00:00</div>
      </div>
    </header>

    <main class="layout">
      <section class="grid-wrap">
        <div id="grid"></div>
      </section>

      <aside class="sidebar">
        <div class="clues">
          <h3>Across</h3>
          <ol id="acrossClues"></ol>

          <h3>Down</h3>
          <ol id="downClues"></ol>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
